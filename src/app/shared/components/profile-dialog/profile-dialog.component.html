<div class="profile-dialog-wrapper">
  <div class="dialog-header">
    <div class="header-icon-box">
      <mat-icon>badge</mat-icon>
    </div>
    <div class="header-text">
      <h2 mat-dialog-title class="dialog-title">{{ translationService.get('dialogs.editProfileTitle') }}</h2>
      <p class="dialog-subtitle">{{ translationService.get('dialogs.editProfileSubtitle') }}</p>
    </div>
  </div>

  <mat-dialog-content class="dialog-content">
    <!-- Full Name -->
    <div class="input-group">
      <label class="field-label">{{ translationService.get('dialogs.fullNameLabel') }}</label>
      <mat-form-field appearance="outline" class="dialog-field">
        <mat-icon matPrefix class="field-icon">person</mat-icon>
        <input matInput [(ngModel)]="name" [placeholder]="translationService.get('dialogs.fullNamePlaceholder')" required>
      </mat-form-field>
    </div>

    <!-- Phone Number -->
    <div class="input-group">
      <label class="field-label">{{ translationService.get('dialogs.mobileLabel') }}</label>
      <mat-form-field appearance="outline" class="dialog-field">
        <mat-icon matPrefix class="field-icon">call</mat-icon>
        <input matInput type="tel" [(ngModel)]="phone" [placeholder]="translationService.get('dialogs.mobilePlaceholder')">
      </mat-form-field>
    </div>

    <!-- Business / Farm Name -->
    <div class="input-group">
      <label class="field-label">{{ translationService.get('dialogs.farmBusinessLabel') }}</label>
      <mat-form-field appearance="outline" class="dialog-field">
        <mat-icon matPrefix class="field-icon">agriculture</mat-icon>
        <input matInput [(ngModel)]="businessName" [placeholder]="translationService.get('dialogs.farmBusinessPlaceholder')">
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-button type="button" class="btn-cancel" (click)="onCancel()">
      {{ translationService.get('common.cancel') }}
    </button>
    <button mat-raised-button color="primary" type="button" class="btn-save" [disabled]="!name.trim()" (click)="onSave()">
      <mat-icon>check</mat-icon>
      {{ translationService.get('common.save') }}
    </button>
  </mat-dialog-actions>
</div>
