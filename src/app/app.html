<div class="app-wrapper">
    <!-- Loader -->
    <app-loader />
    
    <!-- Toast Notifications -->
    <app-toast />

    <!-- Header Component (Hidden when Kisan Detail Page is open) -->
    @if (!recordsService.isKisanDetailPageOpen()) {
    <app-header 
        (themeToggle)="toggleTheme()" 
        (languageToggle)="toggleLanguage()" 
    />
    }

    <!-- Main Content Area -->
    <main class="main-content" [class.kisan-detail-main]="recordsService.isKisanDetailPageOpen()">
        <router-outlet />
    </main>

    <!-- Bottom Navigation Component -->
    @if (showNavigation()) {
    <app-bottom-navigation 
        [navItems]="navItemsWithTranslations()"
        [activeRoute]="activeRoute()"
        (navChange)="onNavChange($event)"
    />
    }
</div>
